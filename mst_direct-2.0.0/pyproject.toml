[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mst-direct"
version = "2.0.0"
description = "Matching via Sinkhorn Transport: multivariate, conditional, large-grid geostatistical simulation that preserves complex non-linear joint distributions exactly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tcharlies Bachmann Schmitz", email = "tcharliesschmitz@gmail.com" }]
keywords = [
    "geostatistics", "spatial-simulation", "optimal-transport", "sinkhorn",
    "multivariate", "conditional-simulation", "non-parametric",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "build", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://pypi.org/project/mst-direct/"
Paper = "https://arxiv.org/abs/2603.18036"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mst_direct = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
